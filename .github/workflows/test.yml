name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs: a rapid re-push shouldn't leave obsolete suites
# burning runners alongside the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The job runs in 5-7 minutes (re-measured 2026-09-18; it was ~90s when
    # this was written, and 10 had become a thin margin). The GitHub default is
    # 360 minutes, so without this a single hung test burns six hours of runner
    # time before failing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Track the version production runs. Bump alongside the droplet.
          python-version: "3.13"
          cache: pip
          # All three files: requirements-dev.txt is just `-r requirements.txt` plus
          # tooling, so keying on it alone would not rotate the cache when the
          # actual pins change — and constraints.txt now carries the entire
          # transitive tree, so omitting it would reuse a cache built against the
          # previous one, which is the same failure in a new place.
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      # -c constraints.txt so CI resolves the same transitive tree as prod (ADR-042).
      # Without it CI silently tests against whatever pip happens to resolve that day,
      # which is the divergence this repo has already been bitten by once.
      - run: pip install -r requirements-dev.txt -c constraints.txt
      # ENVIRONMENT=testing selects TestingConfig (in-memory SQLite) and is what
      # activates the *_FAKE_NOW time seams the state-detection tests rely on.
      # No database service is needed here; the pytest-postgres job below runs
      # the same suite on production's engine.
      # -ra surfaces skip reasons. A few tests self-skip on the *symptom* of a
      # regression (a route 404ing, a page 302ing), which would otherwise turn
      # a failure into a silent skip on a green run.
      - run: pytest tests/ -q -ra
        env:
          ENVIRONMENT: testing

  # The same suite on Postgres, production's engine and major version. In-memory
  # SQLite cannot see a row lock, a second connection, a timestamptz cast, strict
  # column types or foreign-key enforcement; every `postgres`-marked test runs
  # only here. TEST_DATABASE_URL (config.py TestingConfig) is the seam, and
  # tests/conftest.py refuses any database whose name does not end in `_test`.
  pytest-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Track the major version DO Managed Postgres runs. Bump alongside it.
        image: postgres:18
        env:
          # No password anywhere: a throwaway container on the runner's
          # loopback, and a credential-shaped URL would trip secret scanning.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: ccc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ccc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: pytest tests/ -q -ra
        env:
          ENVIRONMENT: testing
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/ccc_test
