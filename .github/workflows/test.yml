name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs: a rapid re-push shouldn't leave obsolete suites
# burning runners alongside the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite runs in ~90s. The GitHub default is 360 minutes, so without
    # this a single hung test burns six hours of runner time before failing.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Track the version production runs. Bump alongside the droplet.
          python-version: "3.13"
          cache: pip
          # All three files: requirements-dev.txt is just `-r requirements.txt` plus
          # tooling, so keying on it alone would not rotate the cache when the
          # actual pins change — and constraints.txt now carries the entire
          # transitive tree, so omitting it would reuse a cache built against the
          # previous one, which is the same failure in a new place.
          cache-dependency-path: |
            requirements*.txt
            constraints.txt
      # -c constraints.txt so CI resolves the same transitive tree as prod (ADR-042).
      # Without it CI silently tests against whatever pip happens to resolve that day,
      # which is the divergence this repo has already been bitten by once.
      - run: pip install -r requirements-dev.txt -c constraints.txt
      # ENVIRONMENT=testing selects TestingConfig (in-memory SQLite) and is what
      # activates the *_FAKE_NOW time seams the state-detection tests rely on.
      # No database service is needed.
      # -ra surfaces skip reasons. A few tests self-skip on the *symptom* of a
      # regression (a route 404ing, a page 302ing), which would otherwise turn
      # a failure into a silent skip on a green run.
      - run: pytest tests/ -q -ra
        env:
          ENVIRONMENT: testing
