name: Tests

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs: a rapid re-push shouldn't leave obsolete suites
# burning runners alongside the current one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Track the version production runs. Bump alongside the droplet.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # ENVIRONMENT=testing selects TestingConfig (in-memory SQLite) and is what
      # activates the *_FAKE_NOW time seams the state-detection tests rely on.
      # No database service is needed.
      - run: pytest tests/ -q
        env:
          ENVIRONMENT: testing
