      - generic [ref=e280]:
        - heading " Tiebreaker" [level=3] [ref=e281]:
          - generic [ref=e282]: 
          - text: Tiebreaker
        - paragraph [ref=e283]:
          - text: If two or more players are tied on total points, the tiebreaker is
          - strong [ref=e284]: total USA goals scored in the tournament
          - text: . The player whose guess is closest wins. If still tied, those players split the relevant prize pool equally.
      - generic [ref=e286]:
        - heading " Edge Cases" [level=3] [ref=e287]:
          - generic [ref=e288]: 
          - text: Edge Cases
        - list [ref=e289]:
          - listitem [ref=e290]:
            - strong [ref=e291]: "Extra time / penalties:"
            - text: If a knockout match goes to extra time or penalties, the winning team still receives the full knockout points for that round. There is no penalty or bonus for the method of victory.
          - listitem [ref=e292]:
            - strong [ref=e293]: "Group stage draws:"
            - text: Both teams receive 1 point each (base), multiplied by their respective tier multipliers.
          - listitem [ref=e294]:
            - strong [ref=e295]: "Best 3rd advancement:"
            - text: 8 of 12 third-place teams advance. Those 8 receive the Best 3rd milestone bonus.
          - listitem [ref=e296]:
            - strong [ref=e297]: "Multiplier application:"
            - text: All base points are multiplied by the team's tier multiplier. A Tier 5 (×7) team that wins the World Cup earns 50 × 7 = 350 points for the championship alone.
