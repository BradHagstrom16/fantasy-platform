# Fantasy Sports Platform — Nginx site config
# Replace every instance of "yourdomain.com" with your actual domain before use.
# Install: sudo cp /home/deploy/fantasy-platform/deploy/nginx.conf /etc/nginx/sites-available/fantasy-platform
# Enable: sudo ln -s /etc/nginx/sites-available/fantasy-platform /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    # --- Real client IP restoration (engineering backlog 2.5) ----------------
    # The TCP peer here is a Cloudflare edge, so $remote_addr would otherwise
    # be an edge IP and every user behind one PoP would share rate-limit
    # buckets. When — and only when — the peer is in a range below, realip
    # rewrites $remote_addr from CF-Connecting-IP (single value, set by
    # Cloudflare itself; not forgeable through the CF proxy).
    # $proxy_add_x_forwarded_for then appends the REAL client as the LAST
    # X-Forwarded-For entry, which the app's ProxyFix(x_for=1) selects.
    # Direct-to-origin requests have a peer outside these ranges: headers are
    # ignored and they key on their true peer IP. Fail-soft: a stale range
    # only degrades that slice to edge-IP keying, never a block.
    #
    # Ranges from https://www.cloudflare.com/ips-v4 + /ips-v6 (fetched
    # 2026-07-30 — re-verify at install). Refresh recipe:
    #   curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6 \
    #     | sed 's/^/    set_real_ip_from /; s/$/;/'
    # then mirror the list in tests/test_client_ip_keying.py and reinstall
    # per the header of this file.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    server_tokens off;
    client_max_body_size 10M;

    # Security headers — apply to dynamic responses.
    # (The /static/ block below uses its own add_header for Cache-Control,
    # which per Nginx inheritance rules replaces this set; that's acceptable
    # because static assets inherit HSTS/etc. client-side from HTML hits.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Compress text responses (Chart.js, JSON, HTML)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Serve static files directly — Gunicorn never sees these requests
    location /static/ {
        alias /home/deploy/fantasy-platform/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all other requests to Gunicorn via Unix socket
    location / {
        proxy_pass         http://unix:/run/fantasy-platform/gunicorn.sock;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Pin the forwarded host to the canonical apex. The app's
        # ProxyFix(x_host=1) drives request.host from this header, so pinning it
        # to a single value makes request.host deterministic no matter which
        # Host the visitor arrived on (apex, www, a translated/proxy host, …).
        # That keeps the emailed reset link and any url_for(_external=True) on
        # the apex and removes the www-vs-apex host/referrer mismatch behind
        # Cloudflare. Bare apex — the install-time domain substitution
        # (yourdomain.com -> real domain) fills it in; keep it un-prefixed.
        #
        # This pins the *forwarded* host only; it does NOT redirect the browser,
        # so the visible address bar stays on www until the canonical www->apex
        # 301 (a deliberate Cloudflare edge redirect, given the origin cloak)
        # sends the browser to the apex. Activate that 301 as part of this
        # rollout — without it, www visitors keep a www-scoped session cookie
        # while the app resolves apex-external links, so a click onto an apex
        # link logs them out.
        proxy_set_header   X-Forwarded-Host  yourdomain.com;
        proxy_read_timeout 90;
    }
}
